{% extends "portal/base.html" %}
{% block title %}Link Child{% endblock %}
{% block content %}
<h1 class="h3 mb-4">Link a Student to Your Parent Account</h1>
{% if message %}<div class="alert alert-info">{{ message }}</div>{% endif %}
<form method="post" class="col-md-5">
  {% csrf_token %}
  <div class="mb-3">
    <label class="form-label">Student ID</label>
    <input type="text" name="student_id" class="form-control" required>
  </div>
  <div class="mb-3">
    <label class="form-label">Verification code (last 4 digits of student ID)</label>
    <input type="text" name="verification_code" class="form-control" maxlength="4" required>
  </div>
  <button type="submit" class="btn btn-primary">Link student</button>
</form>
{% endblock %}
